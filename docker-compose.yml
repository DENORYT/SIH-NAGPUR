version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./shadowlink.db
    volumes:
      - ./backend:/app
    restart: unless-stopped
    
  # Frontend is static HTML/JS, no build required.
  # We use a lightweight Nginx container to serve it professionally.
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
